<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WickChart — modern charting web component</title>
  <meta name="description" content="Demo of <wick-chart>: a zero-dependency financial charting web component." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='6' fill='%236366f1'/%3E%3Crect x='6' y='9' width='3.4' height='7' rx='1' fill='white'/%3E%3Crect x='14.5' y='7' width='3.4' height='5' rx='1' fill='white' opacity='.6'/%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <!-- the narrator/scenario/ai packages import their shared pure core from
       wickchart/core; this maps the bare specifier for the in-repo demo -->
  <script type="importmap">
    { "imports": { "wickchart/core": "../src/core.js" } }
  </script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row topbar-main">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="url(#g)" />
          <path d="M7.2 6.5v11" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
          <rect x="5.6" y="9" width="3.2" height="6" rx="0.8" fill="#fff"/>
          <path d="M16.8 6.5v11" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
          <rect x="15.2" y="8" width="3.2" height="4.4" rx="0.8" fill="#fff" opacity=".55"/>
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="24" y2="24">
              <stop stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="brand-name">Wick<b>Chart</b></span>
        <span class="brand-tag">component</span>
      </div>

      <div class="cluster" aria-label="Market">
        <div class="seg" id="seg-symbol" role="group" aria-label="Symbol"></div>
        <div class="seg" id="seg-tf" role="group" aria-label="Timeframe"></div>
      </div>

      <div class="cluster" aria-label="Chart style">
        <div class="seg" id="seg-type" role="group" aria-label="Chart type">
        <button type="button" data-type="candles" class="active" aria-pressed="true" title="Candlesticks">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M7 4v3.2M7 14.8V20M17 4v2.2M17 13.8V20"/>
            <rect x="4.8" y="7.2" width="4.4" height="7.6" rx="1"/>
            <rect x="14.8" y="6.2" width="4.4" height="7.6" rx="1"/>
          </svg><span>Candles</span>
        </button>
        <button type="button" data-type="line" aria-pressed="false" title="Line">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 16.5l5-6 4 3.4L21 5"/>
          </svg><span>Line</span>
        </button>
        <button type="button" data-type="area" aria-pressed="false" title="Area">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 15.5l5-6 4 3.4L21 6" />
            <path d="M3 15.5l5-6 4 3.4L21 6v12H3z" fill="currentColor" fill-opacity=".18" stroke="none"/>
          </svg><span>Area</span>
        </button>
        <button type="button" data-type="bars" aria-pressed="false" title="OHLC bars">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M7 4v16M4 9h3M7 15h3M17 6v12M14 10h3M17 14h3"/>
          </svg><span>Bars</span>
        </button>
        <button type="button" data-type="hollow" aria-pressed="false" title="Hollow candles">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M7 4v3.2M7 14.8V20"/>
            <rect x="4.8" y="7.2" width="4.4" height="7.6" rx="1" fill="none"/>
            <path d="M17 6.5v1.7M17 14.1V20M14.8 8.2h4.4v5.9h-4.4z" fill="currentColor" fill-opacity=".25" stroke="none"/>
          </svg><span>Hollow</span>
        </button>
        <button type="button" data-type="heikin" aria-pressed="false" title="Heikin-Ashi">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M7 3.5v3M7 15v5.5"/>
            <rect x="4.9" y="6.5" width="4.2" height="8.5" rx="1" fill="currentColor" fill-opacity=".3"/>
            <path d="M17 5v2.3M17 15.5V19"/>
            <rect x="14.9" y="7.3" width="4.2" height="8.2" rx="1" fill="currentColor" fill-opacity=".3"/>
          </svg><span>Heikin</span>
        </button>
        </div>
      </div>

      <div class="topbar-right">
        <button type="button" class="icon-btn" id="btn-live" aria-pressed="true" title="Pause / resume live updates">
          <span class="live-dot" aria-hidden="true"></span>
          <svg id="ico-pause" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="currentColor">
            <rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/>
          </svg>
          <svg id="ico-play" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="currentColor" style="display:none">
            <path d="M8 5.5v13l10-6.5z"/>
          </svg>
          <span id="live-label">Live</span>
        </button>
        <button type="button" class="icon-btn" id="btn-explain" title="AI-ready summary of the visible window — copy it into any AI chat">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.5 8.5 0 01-8.5 8.5c-1.4 0-2.8-.3-4-.9L3 21l1.9-5.5A8.5 8.5 0 1121 11.5z"/>
            <path d="M8.5 10.5h7M8.5 13.5h4"/>
          </svg>
          <span>Explain</span>
        </button>
        <button type="button" class="icon-btn" id="btn-theme" title="Toggle light / dark theme">
          <svg id="ico-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/>
          </svg>
          <svg id="ico-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="display:none">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4L19 19M19 5l-1.6 1.6M6.6 17.4L5 19"/>
          </svg>
          <span>Theme</span>
        </button>
      </div>
    </div>

    <div class="topbar-row topbar-second">
      <div class="cluster cluster-studies" aria-label="Studies">
        <div class="chips" id="chips" role="group" aria-label="Indicators"></div>
        <div class="chips" id="script-chips" role="group" aria-label="Custom indicators"></div>
        <div class="script-row">
          <input id="script-input" type="text" spellcheck="false" autocomplete="off"
                 placeholder="add a study… e.g. close - sma(close,20)"
                 aria-label="Custom indicator expression (WickScript)" />
          <label class="script-pane" title="Draw in its own pane instead of on the price chart">
            <input type="checkbox" id="script-pane" /> pane
          </label>
          <button type="button" id="script-add" class="script-add" title="Add the expression as an indicator">+ Expr</button>
          <span id="script-error" class="script-error" role="status" aria-live="polite"></span>
        </div>
      </div>

      <div class="cluster cluster-view" aria-label="View toggles">
        <button type="button" class="icon-btn" id="btn-sonify" aria-pressed="false" aria-label="Sound" title="Toggle sonification — arrow keys play the chart as pitch">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5L6 9H3v6h3l5 4V5z"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/>
          </svg>
          <span>Sound</span>
        </button>
        <button type="button" class="icon-btn" id="btn-play" aria-label="Play" title="Play the visible range as a pitch sweep">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="currentColor">
            <path d="M8 5.5v13l10-6.5z"/>
          </svg>
          <span>Play</span>
        </button>
        <button type="button" class="icon-btn" id="btn-coview" aria-pressed="false" aria-label="Co-view" title="Share your pointer across tabs (co-view)">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="4" width="12" height="12" rx="2"/>
            <rect x="9.5" y="8" width="12" height="12" rx="2"/>
          </svg>
          <span>Co-view</span>
        </button>
        <button type="button" class="icon-btn" id="btn-volshading" aria-pressed="false" aria-label="Vol shade" title="Toggle volatility-regime shading (calm/normal/hot by realized-vol percentile)">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12h3l3-7 4 14 3-7h7"/>
          </svg>
          <span>Vol shade</span>
        </button>
        <button type="button" class="icon-btn" id="btn-annotations" aria-pressed="false" aria-label="Annotate" title="Toggle smart annotations (spikes, gaps, pivots, divergences)">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l2.2 5.6L20 10l-5.8 1.4L12 17l-2.2-5.6L4 10l5.8-1.4z"/>
            <path d="M19 16.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/>
          </svg>
          <span>Annotate</span>
        </button>
        <button type="button" class="icon-btn" id="btn-profile" aria-pressed="false" aria-label="Profile" title="Toggle volume profile (POC + value area)">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M20 6h-9M20 11h-5M20 16h-12M20 21h-16"/>
          </svg>
          <span>Profile</span>
        </button>
        <button type="button" class="icon-btn" id="btn-stats" aria-pressed="false" aria-label="Stats" title="Toggle visible-range statistics">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 19V9M10 19V5M16 19v-7M21 19H3"/>
          </svg>
          <span>Stats</span>
        </button>
        <button type="button" class="icon-btn" id="btn-zones" aria-pressed="false" aria-label="Zones" title="Toggle demo server-side overlays (supply/demand zones + support levels)">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="3.5" width="10" height="6" rx="1"/>
            <rect x="10.5" y="11.5" width="10" height="6" rx="1" opacity=".55"/>
            <path d="M3.5 21h17"/>
          </svg>
          <span>Zones</span>
        </button>
        <button type="button" class="icon-btn" id="btn-scenario" aria-pressed="false" aria-label="Scenario" title="Toggle a scenario projection — bull ghost path + ±1σ/±2σ volatility cone into future space">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 17l5-5 4 3 8-9"/>
            <path d="M20 10V6h-4" opacity=".6"/>
            <path d="M14 20h7M14 20c0-4 3-6 7-7" opacity=".35"/>
          </svg>
          <span>Scenario</span>
        </button>
        <button type="button" class="icon-btn" id="btn-walk" aria-pressed="false" aria-label="Walk" title="Bar-walk narrator — replay history while captions describe spikes, gaps, pivots and legs">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 4v14"/>
            <path d="M5 18l3-2.5M5 18l-3-2.5" opacity=".6"/>
            <path d="M10 8h9M10 12h6M10 16h9" opacity=".9"/>
          </svg>
          <span>Walk</span>
        </button>
        <button type="button" class="icon-btn" id="btn-brush" aria-pressed="false" aria-label="Brush" title="Delta brush — drag across bars to select a range and get Δ%, extremes and summed volume">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20c2-1 3-2 3-4l9-9 4 4-9 9c-2 0-3 1-4 3" transform="translate(-1 -1)"/>
            <path d="M14 5l1-1a1.4 1.4 0 012 0l2 2a1.4 1.4 0 010 2l-1 1" opacity=".7"/>
          </svg>
          <span>Brush</span>
        </button>
        <button type="button" class="icon-btn" id="btn-story" aria-pressed="false" aria-label="Story" title="Story mode — play a guided tour of the data: overview, the volume spike, the trend, and the plan">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5V6a2 2 0 012-2h13v16H6.5A2.5 2.5 0 004 22.5v-3z"/>
            <path d="M9 8h6M9 12h4" opacity=".7"/>
          </svg>
          <span>Story</span>
        </button>
      </div>

      <div class="cluster cluster-draw" aria-label="Draw">
        <div class="seg" id="seg-draw" role="group" aria-label="Drawing tools">
          <button type="button" id="btn-draw-select" class="active" title="Select mode — click a drawing to select, drag to move, drag the square handles to re-anchor, Del removes; click a note again to edit its text">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 8-6.5 1.5L9 19z"/></svg><span>Select</span>
          </button>
          <button type="button" id="btn-draw-trend" title="Trendline — drag to draw; anchors magnet-snap to bars &amp; OHLC">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19L20 5"/></svg><span>Line</span>
          </button>
          <button type="button" id="btn-draw-ray" title="Ray — a trendline extended into future space">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19L20 5"/><path d="M13 5h7v7" opacity=".8"/></svg><span>Ray</span>
          </button>
          <button type="button" id="btn-draw-level" title="Horizontal level — click to place at a price, with a price chip">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h18" stroke-dasharray="3 3"/></svg><span>Level</span>
          </button>
          <button type="button" id="btn-draw-box" title="Rectangle — drag a zone; fills at 10% opacity">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg><span>Box</span>
          </button>
          <button type="button" id="btn-draw-fib" title="Fibonacci retracement — drag from swing high to low; 0–1 grid with labels">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 11h12M3 16h15M3 21h12" opacity=".9"/></svg><span>Fib</span>
          </button>
          <button type="button" id="btn-draw-text" title="Text note — click to place, type right away; click again to re-edit">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg><span>Note</span>
          </button>
          <button type="button" id="btn-draw-magnet" aria-pressed="true" title="Magnet snap — anchors pin to bar times &amp; OHLC prices (toggle)">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v8a6 6 0 0012 0V3"/><path d="M6 3h4v5H6zM14 3h4v5h-4z" opacity=".85"/></svg><span>Magnet</span>
          </button>
          <button type="button" id="btn-draw-undo" title="Undo the last drawing change">⤺ Undo</button>
          <button type="button" id="btn-draw-delete" title="Delete the selected drawing (or press Del)" disabled>Delete</button>
          <button type="button" id="btn-draw-clear" title="Remove all drawings">Clear</button>
        </div>
      </div>

      <div class="cluster" aria-label="Plugins">
        <div class="seg" role="group" aria-label="Plugin toggles">
          <button type="button" id="btn-sessions" aria-pressed="false" title="Market session shading (wickchart-sessions plugin) — click to cycle: off → crypto → forex → NYSE → CME">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.6 2.5 13.4 0 16-2.5-2.6-2.5-13.4 0-16z"/></svg><span id="lbl-sessions">Sessions</span>
          </button>
          <button type="button" id="btn-compare" aria-pressed="false" title="Compare overlays (wickchart-compare plugin) — click to cycle: off → ETH → ETH+SOL, percent-rebase against this chart">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-9"/><path d="M3 11l4-4 3 2" opacity=".6"/></svg><span id="lbl-compare">Compare</span>
          </button>
          <button type="button" id="btn-navigator" aria-pressed="false" title="Range navigator (wickchart-navigator plugin) — full-dataset silhouette with a draggable viewport window">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="14" width="18" height="7" rx="1.5"/><path d="M6 17.5l3-2 3 2 3-2.5 3 2"/></svg><span>Navigator</span>
          </button>
          <button type="button" id="btn-signals" aria-pressed="false" title="Pattern signals (wickchart-signals plugin) — bullish/bearish engulfing, pin bars and inside bars as badges; hover one for the explanation">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8v9M4 11l3-3 3 3"/><path d="M17 16V7M14 10l3-3 3 3" opacity=".7"/></svg><span>Signals</span>
          </button>
          <button type="button" id="btn-tape" aria-pressed="false" title="Time &amp; sales (wickchart-tape plugin) — live trade prints docked below the chart, colored by side (shares the bottom strip with the navigator)">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M4 12h14M4 18h7"/><circle cx="19" cy="6" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg><span>Tape</span>
          </button>
        </div>
        <div class="seg" role="group" aria-label="Layouts">
          <button type="button" id="btn-layout-save" title="Save the current setup under a name — type, indicators, theme, view, drawings, positions, alerts (wickchart-layouts plugin)">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l5 5v13a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg><span>Save view</span>
          </button>
          <button type="button" id="btn-layout-load" title="Load a saved setup — cycles through the saved layouts (wickchart-layouts plugin)">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 8 0 0114.9-4M20 13a8 8 0 01-14.9 4"/><path d="M4 4v4h4M20 20v-4h-4"/></svg><span>Load view</span>
          </button>
        </div>
        <div class="seg" role="group" aria-label="Replay transport">
          <button type="button" id="btn-replay-start" title="Bar replay (wickchart-replay plugin) — start at ~70% of the data; the future stays hidden. Pauses the live feed.">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14"/><path d="M18 6l-9 6 9 6z"/></svg><span id="lbl-replay">Replay</span>
          </button>
          <button type="button" id="btn-replay-play" disabled title="Play / pause the replay (Space)">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="ico-replay-play"><path d="M8 5l11 7-11 7z"/></svg>
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="display:none" id="ico-replay-pause"><path d="M8 5v14M16 5v14"/></svg>
          </button>
          <button type="button" id="btn-replay-step" disabled title="Reveal one bar (→)">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6l8 6-8 6z"/><path d="M18 5v14"/></svg>
          </button>
          <button type="button" id="btn-replay-stop" disabled title="Exit replay and restore the full dataset (Esc)">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
          </button>
        </div>
      </div>

      <div class="cluster cluster-trade" aria-label="Trade">
        <div class="seg" id="seg-trade" role="group" aria-label="Trading">
          <button type="button" id="btn-long" title="Add a demo long position (stop −2%, target +4%)">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>+ Long</span>
          </button>
          <button type="button" id="btn-alert" title="Add a price alert 1% above the last close">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/></svg><span>+ Alert</span>
          </button>
          <button type="button" id="btn-expr-alert" title="Add a scripted alert — fires when volume > sma(volume,20) * 2.5 (WickScript predicate)">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg><span>+ Expr</span>
          </button>
          <button type="button" id="btn-risk" aria-pressed="false" title="Toggle a risk plan — R-multiple grid anchored at the last close (entry, stop −1R, dashed 1R/2R/3R reward lines)">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-9M22 20H2"/></svg><span>Risk</span>
          </button>
          <button type="button" id="btn-clear-trade" title="Remove positions and alerts">Clear</button>
        </div>
      </div>
    </div>
  </header>

  <main class="chart-area">
    <wick-chart id="chart" theme="dark" type="candles" indicators="volume"></wick-chart>
    <aside class="explain-panel" id="explain-panel" hidden aria-label="AI-ready chart summary">
      <div class="explain-head">
        <span>AI-ready summary</span>
        <span class="explain-actions">
          <button type="button" id="explain-copy">Copy</button>
          <button type="button" id="explain-close" aria-label="Close panel">✕</button>
        </span>
      </div>
      <pre id="explain-text"></pre>
      <p class="explain-hint">Paste into any AI chat and ask: “explain this chart and the main risks &amp; setup”.</p>
    </aside>
  </main>

  <footer class="statusbar">
    <span class="status"><span class="dot" id="status-dot"></span><span id="status-text">starting…</span></span>
    <span class="range mono" id="range-text"></span>
    <span class="hint" id="walk-caption" hidden></span>
    <span class="hint">scroll to zoom · drag to pan · shift-drag to measure · double-click to reset</span>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
